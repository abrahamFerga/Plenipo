# Approval expiry. Deterministic — no AI, no secrets, no third-party actions.
#
# `agent:approved` is a statement about a diff and its runtime evidence, not about a pull request.
# Without this, a PR reviewed at commit A keeps the label through commit B — or after its evidence
# body changes — and the scheduled merger can land something the verdict never covered.
#
# `add-labels` in the reviewer can only ADD, so expiry has to live here. The reviewer re-runs on the
# same events and re-labels from scratch; this job finishes in seconds while that takes minutes, so
# the new verdict lands after the reset, not before it. If that race ever inverts, it loses an
# approval rather than keeping a stale one — the safe direction.
name: Reset agent approval

on:
  # `synchronize` alone is NOT enough. A base-branch retarget arrives as `edited` carrying
  # `changes.base`, and it changes the effective diff without changing the head SHA. `reopened`
  # can also republish a different head. Keep this set aligned with agent-gates.yml.
  # Use the trusted default-branch workflow definition. This job never checks out or executes the
  # PR; it only removes labels through the API, so a PR cannot edit the expiry control that governs
  # its own earlier verdict.
  pull_request_target:
    types: [synchronize, edited, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to clear the verdict on.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: approval-reset-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  reset:
    name: Drop a verdict the new commits have not earned
    runs-on: ubuntu-latest
    # Title-only edits do not affect the verdict. The body carries runtime evidence, so body and
    # base edits both expire it and the verdict workflow re-runs on the same event.
    if: >-
      github.event_name != 'pull_request_target'
      || github.event.action != 'edited'
      || github.event.changes.body != null
      || github.event.changes.base != null
    steps:
      # A missing label is normal and must never fail a pull request. Any other API failure must be
      # visible: otherwise the stale approval survives and the merge cron cannot tell.
      - name: Clear the review verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          failed=
          for label in 'agent:approved' 'agent:changes-requested'; do
            if out=$(gh api -X DELETE "repos/$REPO/issues/$PR/labels/$label" 2>&1); then
              echo "cleared  $label"
              continue
            fi
            case "$out" in
              *'(HTTP 404)'*) echo "not set  $label" ;;
              *) echo "::error::could not clear $label — the approval may be stale: $out"; failed=1 ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "Failing the run: a verdict that could not be cleared must not look cleared." >&2
            exit 1
          fi
