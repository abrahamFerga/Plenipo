# =============================================================================
# publish.yml — Publish the Plenipo platform artifacts.
# -----------------------------------------------------------------------------
# Runs when a GitHub Release is published (the tag drives the version), or on a
# manual dispatch with an explicit version. Three distribution channels:
#
#  1. public npm registry — the @plenipo/ui LIBRARY, so product hosts install it
#     with `pnpm add @plenipo/ui` (no release-asset copying). Published with
#     provenance. Requires the NPM_TOKEN secret (an automation token for the @abrahamferga scope).
#
#  2. GitHub Release ASSETS (release trigger only) — the nupkgs plus the two prebuilt UI
#     bundles (the plenipo-ui APP SHELL zip and the @plenipo/admin-ui console zip). Assets are
#     ANONYMOUSLY downloadable, so a product repo can vendor its .packages/ and wwwroot/ from a
#     release URL with no checkout, no PAT, no registry. The bundles are brand-agnostic: the
#     shell resolves the product name at runtime from /api/platform/branding.
#
#  3. GitHub Packages NuGet feed — for authenticated `dotnet add package` consumers.
#     (GitHub Packages requires a read:packages PAT even for public repos, which is
#     why the release assets above are the primary channel.)
#       dotnet nuget add source https://nuget.pkg.github.com/<OWNER>/index.json \
#         --name plenipo --username <user> --password <a PAT with read:packages>
#
#  4. nuget.org — pushed via Trusted Publishing: NuGet/login exchanges this
#     workflow's GitHub OIDC token for a short-lived API key, so no NuGet secret
#     is stored. The nuget.org policy is keyed to repository abrahamFerga/Plenipo
#     + workflow file publish.yml with NO environment; adding `environment:` to
#     the job would break the claim match. Once consumers restore Plenipo.* from
#     nuget.org, the vendored .packages/ channel in product repos can retire.
#
# The local pack+consume path is already proven on every CI run by
# eng/verify-packaging.sh (see ci.yml).
# =============================================================================

name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet version to publish (e.g. 0.1.0-alpha.2)"
        type: string
        required: true

# GITHUB_TOKEN needs package-write for GitHub Packages and contents-write to
# attach assets to the release. id-token: write feeds two OIDC flows: `npm
# publish --provenance` minting a signed attestation for @plenipo/ui, and
# NuGet/login exchanging the workflow's OIDC token for a short-lived nuget.org
# API key (Trusted Publishing).
permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"

jobs:
  publish:
    name: Pack & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"   # strip the leading "v" from the release tag
          else
            version="${{ github.event.inputs.version }}"
          fi
          if [ -z "$version" ]; then echo "No version resolved." >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Plenipo packages @ $version"

      - name: Pack
        run: |
          dotnet pack Plenipo.slnx -c Release -o ./artifacts \
            -p:PackageVersion="${{ steps.ver.outputs.version }}" \
            -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}" \
            -p:PackageProjectUrl="${{ github.server_url }}/${{ github.repository }}"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # nuget.org, via Trusted Publishing (policy: repo abrahamFerga/Plenipo,
      # workflow publish.yml, no environment — this job must never declare
      # `environment:`). The first successful push permanently claims the
      # Plenipo.* IDs; nuget.org versions can be unlisted but never deleted.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: abrahamFerga

      - name: Push to nuget.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      # ------------------------------------------------------------------------
      # Prebuilt UI bundles — brand-agnostic (runtime branding) + same-origin API
      # (VITE_API_BASE=""), so any product host serves them from wwwroot/ as-is.
      # ------------------------------------------------------------------------
      - name: Setup pnpm
        if: github.event_name == 'release'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0

      - name: Setup Node
        if: github.event_name == 'release'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          # Writes an .npmrc that authenticates to the public npm registry via NODE_AUTH_TOKEN,
          # so the publish step below can `npm publish` @plenipo/ui.
          registry-url: "https://registry.npmjs.org"

      - name: Build UI bundles
        if: github.event_name == 'release'
        env:
          VITE_API_BASE: ""
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend/plenipo-ui build:app
          pnpm -C frontend/admin-ui build
          (cd frontend/plenipo-ui/dist-app && zip -r "$GITHUB_WORKSPACE/artifacts/plenipo-ui-app.zip" .)
          (cd frontend/admin-ui/dist && zip -r "$GITHUB_WORKSPACE/artifacts/plenipo-admin-ui.zip" .)

      # Publish the frontend LIBRARIES to the public npm registry — product hosts that build their
      # own app entry on the moduleUi seam (e.g. Networthy's ADR-0008) install them with
      # `pnpm add @plenipo/ui`, no release-asset copying.
      #
      # Order matters: @plenipo/ui depends on @plenipo/client, so the client has to exist on the
      # registry at the version the ui's manifest will name. Both are published with `pnpm publish`
      # rather than `npm publish` for exactly that dependency — pnpm rewrites the `workspace:*`
      # protocol to the concrete version it just published, which npm would ship verbatim and
      # leave uninstallable.
      #
      # The ui dist is built with VITE_API_BASE="" (frozen at library-build time) so consumers get
      # same-origin API calls; a checked-out source alias still covers dev servers that need a live
      # env. --provenance signs a build attestation (needs id-token: write); --ignore-scripts
      # avoids re-running prepack since we just built; --no-git-checks because the version bump
      # below leaves the tree dirty. Requires an NPM_TOKEN secret (automation token for the
      # @abrahamferga scope).
      - name: Publish @plenipo/client and @plenipo/ui to npm
        if: github.event_name == 'release'
        env:
          VITE_API_BASE: ""
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          pnpm -C frontend/plenipo-client build
          (cd frontend/plenipo-client && npm pkg set version="$VERSION")
          (cd frontend/plenipo-client && pnpm publish --ignore-scripts --no-git-checks --access public --provenance --tag latest)

          pnpm -C frontend/plenipo-ui build
          (cd frontend/plenipo-ui && npm pkg set version="$VERSION")
          (cd frontend/plenipo-ui && pnpm publish --ignore-scripts --no-git-checks --access public --provenance --tag latest)

      - name: Attach artifacts to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.zip --clobber
