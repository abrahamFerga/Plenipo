# Deterministic pull-request gates. No AI, no secrets, no third-party actions.
#
# This is the workflow that makes unattended merging safe: `/plenipo:ship` can be talked out of an
# opinion, and a required status check cannot. Make it a REQUIRED check on the default branch or it
# gates nothing.
#
# `edited` is in the trigger list on purpose: the PR body carries the deterministic runtime and
# red-before-green evidence required for loop PRs and protected diffs.
name: Agent gates

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  gates:
    name: PR gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # --unified=0 keeps context lines out of the removal scan, so an unchanged HasQueryFilter
      # sitting next to an edit does not read as an edit to it.
      - name: Compute the diff
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          git show "origin/${{ github.base_ref }}:.github/scripts/pr-gates.mjs" > "$RUNNER_TEMP/pr-gates.mjs"

      # Execute the evaluator from the trusted base, never the PR's proposed copy. Values arrive as
      # env, never interpolated into the shell — a PR body is untrusted input.
      - name: Evaluate gates
        run: node "$RUNNER_TEMP/pr-gates.mjs" "$RUNNER_TEMP/pr.diff"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
