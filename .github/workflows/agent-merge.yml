# The merger, on a schedule. Deterministic — no AI and no third-party actions. Its write token is a
# user PAT so GitHub emits the label/synchronize/push events that GITHUB_TOKEN deliberately suppresses.
#
# Runs the same `merge-gate.mjs` that `/plenipo:ship` runs locally, so merging keeps working when the
# machine that wrote the code is asleep, and so there is exactly ONE implementation of the gate list.
#
# It merges nothing until `autonomy.level` in workflow.json is >= 1, and it can never merge a PR that
# lacks the `agent:approved` label — which only a review can add. Bounded recovery re-runs the
# original PR verdict after a transient model failure; it never treats the failure as approval. Turn the
# whole thing off with the repository variable AGENT_AUTOMERGE=off (Settings -> Variables), no commit
# required.
#
# Deliberately NOT `pull_request`-triggered: a schedule re-reads the world instead of trusting an
# event payload, so a check that turns red after the review still blocks the merge.
name: Agent merge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  # Not optional, and not obvious. GitHub closes a `Closes #N` issue AS THE MERGING ACTOR, so a
  # `GITHUB_TOKEN` merge without this closes the pull request and silently leaves the issue open —
  # the board then advertises merged work forever and the next tick re-reads it as still to do.
  # It fails quietly, on the happy path, which is why it survived eight days of green runs.
  issues: write

concurrency:
  group: agent-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge what passes every gate
    if: vars.AGENT_AUTOMERGE != 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # A 429 from the review model means no label, not a negative judgement. Recover only an
      # eligible, unheld PR whose same-head verdict has aged out. Existing runs are re-run in their
      # original PR context; dispatch is only a pinned bootstrap when no run exists for that head.
      - name: Recover missing approval verdicts
        id: verdict_recovery
        continue-on-error: true
        run: node .github/scripts/verdict-retry.mjs --dispatch
        env:
          # A user/App token is intentional. GITHUB_TOKEN-authored labels, branch updates and
          # merges do not trigger the downstream workflows that make the loop converge.
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}

      # Recovery grants no merge permission. An Actions API outage must be visible, but it must not
      # prevent a different, already-approved PR from reaching the deterministic merger.
      - name: Report verdict recovery failure
        if: steps.verdict_recovery.outcome == 'failure'
        run: echo "::warning title=Verdict recovery failed::Ready approved PRs will still be evaluated; missing verdicts retry next tick."

      # Dry run first, so the log always records what WOULD have happened even when the merge step
      # is skipped or fails. `--merge` re-evaluates every gate before touching anything.
      - name: Evaluate the gates
        run: node .github/scripts/merge-gate.mjs
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}

      - name: Merge
        run: node .github/scripts/merge-gate.mjs --merge
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
