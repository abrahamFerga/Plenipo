# .github/workflows/consumer-conformance.yml — install into the PLATFORM repo.
#
# The gate that stops one platform change from silently breaking every product built on it.
# Consumer-driven contract testing, in the shape this stack allows: pack the platform at a
# release-candidate version, then build and test each registered consumer against those packages.
#
# The shipped frontend is part of the contract too (#128): a consumer that registers a `frontend`
# directory in consumers.json has its shell built and tested against @plenipo/ui and @plenipo/client
# packed from the same candidate, and changes under the shipped frontend packages trigger the run.
#
# WHAT THIS DOES NOT COVER — state it plainly, because a green check here reads as "safe":
#   * The CSP hash. A product may pin a sha256 of platform-authored INLINE HTML. Change that HTML
#     and the product's SPA white-screens. No managed-API check sees it, and neither does this job
#     unless the consumer has a browser smoke test. Since alpha.29 the served shell carries a
#     per-request nonce and the kit's S15 checks it, so a product on nonces is out of this trap.
#   * Static asset and bundle shape changes beyond what the consumer's frontend build and tests see.
#   * Behavioural drift that still compiles and still passes the consumer's own tests — this gate is
#     only as strong as the consumer suite it runs.
#   * Consumers not registered below, and any marked conformance:false.
# Treat a green result as "the registered consumers still build and pass their own tests", not as
# "this release is safe".
#
# REQUIRES the consumer to centralize its platform version in one MSBuild property, so the whole
# swap is `-p:PlenipoVersion=<rc>`:
#
#   <!-- consumer's Directory.Build.props -->
#   <PropertyGroup><PlenipoVersion>0.1.0-alpha.28</PlenipoVersion></PropertyGroup>
#   <!-- every csproj -->
#   <PackageReference Include="Plenipo.Core" Version="$(PlenipoVersion)" />
#
# Without that property the version is repeated in every csproj and this job has to rewrite files
# instead of passing a flag — brittle, and the first thing to fix in a consumer that lags.

name: Consumer conformance

on:
  pull_request:
    branches: [main]
    # The shipped surface is the .NET packages AND the frontend libraries every product's shell
    # renders from (@plenipo/ui, @plenipo/client) — a change under those paths carries consumer
    # blast radius exactly like src/** does, and a run that never executes is a red gate (#128).
    # The registry itself is a path too, so registering or reconfiguring a consumer is exercised.
    paths:
      - "src/**"
      - "Directory.Packages.props"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "frontend/plenipo-client/**"
      - "frontend/plenipo-ui/**"
      - "frontend/package.json"
      - "frontend/pnpm-lock.yaml"
      - "frontend/pnpm-workspace.yaml"
      - "consumers.json"
  workflow_dispatch:
    inputs:
      consumer:
        description: "Limit to a single consumer repo (owner/name). Blank = all registered."
        required: false

permissions:
  contents: read

jobs:
  discover:
    name: Read the consumer registry
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        # consumers.json is the platform's list of what it must not break. A product that is not
        # in it gets no protection — which is the incentive to register.
        run: |
          filter='${{ inputs.consumer }}'
          if [ -n "$filter" ]; then
            jq -c --arg r "$filter" '{include: [.consumers[] | select(.repo == $r)]}' consumers.json >> out.json
          else
            jq -c '{include: [.consumers[] | select(.conformance != false)]}' consumers.json >> out.json
          fi
          echo "matrix=$(cat out.json)" >> "$GITHUB_OUTPUT"
          cat out.json

  # A raised dependency floor is a breaking change nobody classified: when the platform moved
  # Microsoft.Extensions.AI past what a consumer pinned directly, that consumer failed restore with
  # NU1605 and the changelog said nothing. This job compares every Plenipo.* package's declared
  # floors against the last release's and posts the raised ones — warnings on the run, a table in
  # the summary — for the reviewer and for announce-release, which treats a raised floor as breaking.
  # It informs; the consumer build below is what decides.
  floors:
    name: Dependency floors vs the last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Fetch the last release as the baseline
        run: bash eng/fetch-baseline.sh

      - name: Pack the candidate
        # Package validation is the package job's business; here only the nuspecs matter.
        run: >-
          dotnet pack Plenipo.slnx -c Release -o "$GITHUB_WORKSPACE/floor-packages"
          -p:Version=0.0.0-rc.${GITHUB_RUN_ID} -p:PlenipoPackageValidation=false

      - name: Report raised dependency floors
        run: |
          log="$RUNNER_TEMP/floors.log"
          bash eng/diff-floors.sh artifacts/baseline-feed "$GITHUB_WORKSPACE/floor-packages" | tee "$log"
          {
            echo "### Dependency floors vs the baseline release"
            echo
            grep -E '^::(warning|notice) ' "$log" | sed -E 's/^::[a-z]+ title=([^:]*)::(.*)$/- **\1** — \2/' || true
            echo
            tail -1 "$log"
          } >> "$GITHUB_STEP_SUMMARY"

  conformance:
    name: ${{ matrix.repo }}
    needs: discover
    if: needs.discover.outputs.matrix != ''
    runs-on: ubuntu-latest
    # One red consumer must not hide the others: the whole point is knowing HOW MANY broke.
    continue-on-error: ${{ matrix.required == false }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: platform

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Pack the platform as a release candidate
        id: pack
        working-directory: platform
        run: |
          RC="0.0.0-rc.${GITHUB_RUN_ID}"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          dotnet pack Plenipo.slnx -c Release -p:Version=$RC -o "$GITHUB_WORKSPACE/rc-packages"
          ls "$GITHUB_WORKSPACE/rc-packages"

      # The frontend half of the contract (#128): @plenipo/ui and @plenipo/client are published
      # packages, and a consumer's shell is built from them. Pack both at the same candidate version
      # so the consumer's frontend below builds and tests against THIS PR's UI, not the registry's.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: platform/frontend/pnpm-lock.yaml

      - name: Pack @plenipo/client and @plenipo/ui as the candidate
        working-directory: platform/frontend
        env:
          VITE_API_BASE: ""
        run: |
          RC='${{ steps.pack.outputs.rc }}'
          pnpm install --frozen-lockfile
          pnpm -C plenipo-client build
          pnpm -C plenipo-ui build
          mkdir -p "$GITHUB_WORKSPACE/rc-npm"
          # Version the client first: pnpm pack rewrites the ui's workspace:* dependency to whatever
          # version the client carries at pack time, so the two tarballs reference each other.
          (cd plenipo-client && npm pkg set version="$RC" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/rc-npm")
          (cd plenipo-ui && npm pkg set version="$RC" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/rc-npm")
          ls "$GITHUB_WORKSPACE/rc-npm"

      - name: Check out the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref || 'main' }}
          path: consumer

      - name: Swap in the release candidate
        working-directory: consumer
        run: |
          # The consumer vendors platform packages into .packages and pins them from its own feed,
          # so replacing the folder contents is the whole substitution.
          rm -f .packages/Plenipo.*.nupkg
          cp "$GITHUB_WORKSPACE"/rc-packages/*.nupkg .packages/

      - name: Build the consumer against the candidate
        id: build
        working-directory: consumer
        run: dotnet build ${{ matrix.solution }} -c Release -p:PlenipoVersion=${{ steps.pack.outputs.rc }}

      # A consumer that registers a `frontend` directory (its package.json depends on @plenipo/ui)
      # gets its shell built and tested against the candidate tarballs. Before the .NET suite on
      # purpose: a frontend verdict must not be hidden behind a long Testcontainers run that fails
      # for its own reasons.
      - name: Swap in the candidate @plenipo/ui
        if: matrix.frontend
        working-directory: consumer/${{ matrix.frontend }}
        run: |
          RC='${{ steps.pack.outputs.rc }}'
          client="$GITHUB_WORKSPACE/rc-npm/plenipo-client-$RC.tgz"
          ui="$GITHUB_WORKSPACE/rc-npm/plenipo-ui-$RC.tgz"
          # pnpm overrides redirect every reference — the product's exact pin and the ui's own
          # dependency on the client — to this PR's tarballs. Merged into an existing block so the
          # product's other overrides (a patched vite, a quarantined browserslist table) survive.
          f=pnpm-workspace.yaml
          if [ -f "$f" ]; then sed -i -E '/^[[:space:]]+"?@plenipo\/(ui|client)"?:/d' "$f"; else : > "$f"; fi
          if grep -qE '^overrides:' "$f"; then
            sed -i -E "s|^overrides:.*|overrides:\n  \"@plenipo/client\": \"file:$client\"\n  \"@plenipo/ui\": \"file:$ui\"|" "$f"
          else
            printf '\noverrides:\n  "@plenipo/client": "file:%s"\n  "@plenipo/ui": "file:%s"\n' "$client" "$ui" >> "$f"
          fi
          pnpm install --no-frozen-lockfile
          pnpm ls @plenipo/ui @plenipo/client

      - name: Build and test the consumer's frontend against the candidate
        if: matrix.frontend
        working-directory: consumer/${{ matrix.frontend }}
        run: |
          pnpm run build
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm run test
          else
            echo "No test script: the build is the whole frontend rung for this consumer."
          fi

      - name: Test the consumer against the candidate
        # Runs even when the frontend rung above went red — one red must not hide the other — but
        # not when the .NET build itself failed, because then there is nothing to test.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: consumer
        # Docker is available on the runner, so the consumer's Testcontainers E2E suite runs here
        # too — a compile-clean break in the approval gate or RBAC surfaces only at this rung.
        # PlatformShimGuardTests are inverse guards: they fail when a previously missing platform
        # capability now exists. That is a product-maintenance signal, not a candidate regression.
        run: >-
          dotnet test ${{ matrix.solution }} -c Release
          -p:PlenipoVersion=${{ steps.pack.outputs.rc }}
          --filter 'FullyQualifiedName!~PlatformShimGuardTests'

      - name: Report product shims the platform may have retired
        continue-on-error: true
        working-directory: consumer
        # PlatformShimGuardTests assert the platform is STILL missing something. One going red against
        # the candidate means the candidate shipped it and the product can delete a shim (#144). The
        # output is kept so the next step can turn every red guard into an annotation — the alarm
        # wired to the building where someone is listening.
        run: >-
          dotnet test ${{ matrix.solution }} -c Release
          -p:PlenipoVersion=${{ steps.pack.outputs.rc }}
          --filter 'FullyQualifiedName~PlatformShimGuardTests'
          --logger "console;verbosity=normal"
          2>&1 | tee "$RUNNER_TEMP/shim-guards.log"

      - name: Annotate the shims this candidate retires
        if: always()
        env:
          CONSUMER: ${{ matrix.repo }}
        run: |
          log="$RUNNER_TEMP/shim-guards.log"
          [ -f "$log" ] || exit 0
          retired="$(grep -E '^\s*Failed ' "$log" | sed -E 's/^\s*Failed //; s/ \[[0-9]+ ms\]\s*$//' || true)"
          if [ -z "$retired" ]; then
            echo "No shim guard fired: $CONSUMER carries no shim this candidate retires."
            exit 0
          fi
          count="$(printf '%s\n' "$retired" | wc -l | tr -d ' ')"
          echo "::notice title=$CONSUMER — $count shim(s) this candidate retires::A PlatformShimGuardTests guard went red against the candidate, so the platform now provides what the shim covered. Release-note material for announce-release; the product deletes the shim on upgrade."
          printf '%s\n' "$retired" | while IFS= read -r guard; do
            echo "::notice title=Shim retired in $CONSUMER::$guard"
          done
          {
            echo "### $CONSUMER: shims this candidate retires ($count)"
            echo
            printf '%s\n' "$retired" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  verdict:
    name: Conformance verdict
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required consumer broke
        run: |
          if [ "${{ needs.conformance.result }}" != "success" ]; then
            echo "A registered consumer failed against this change."
            echo "That is the signal this gate exists for: fix the change, or make the break"
            echo "deliberate and coordinate the upgrade with the affected products."
            exit 1
          fi
          echo "All registered consumers build and pass against this change."
